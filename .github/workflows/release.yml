name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, runs anywhere)
        run: >
          dotnet publish ShakeToFind.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/self-contained

      - name: Publish (small, needs .NET 8 Desktop Runtime)
        run: >
          dotnet publish ShakeToFind.csproj -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o out/small

      - name: Collect exes
        shell: pwsh
        run: |
          Copy-Item out/self-contained/ShakeToFind.exe ShakeToFind-win-x64.exe
          Copy-Item out/small/ShakeToFind.exe ShakeToFind-win-x64-needs-dotnet-runtime.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ShakeToFind
          path: ShakeToFind-*.exe

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ShakeToFind-*.exe
          generate_release_notes: true
